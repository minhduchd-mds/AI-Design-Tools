<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <style>
        body{
            font-family: Inter, sans-serif;
            background:#0f172a;
            color:white;
            margin:0;
        }

        .card{
            background:#1e293b;
            margin:10px;
            padding:10px;
            border-radius:10px;
        }

        button{
            width:100%;
            padding:10px;
            border:none;
            border-radius:8px;
            margin-top:8px;
            cursor:pointer;
            background:#3b82f6;
            color:white;
        }
    </style>
</head>

<body>

<div class="card">
    <input type="file" id="file"/>
    <button onclick="run()">🚀 Import PDF</button>
</div>

<ul id="tree"></ul>

<textarea id="code" style="width:100%;height:200px"></textarea>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    async function run(){

        const file = document.getElementById("file").files[0];
        if(!file) return alert("Select PDF");

        const buffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

        const tree = document.getElementById("tree");
        tree.innerHTML = "";

        for(let i=1;i<=pdf.numPages;i++){

            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale:1 });

            const text = await page.getTextContent();

            const textItems = text.items
                .filter(t=>t.str.trim())
                .map((t,idx)=>({

                    id:"t_"+i+"_"+idx,
                    text:t.str,
                    x:t.transform[4],
                    y: viewport.height - t.transform[5],
                    fontSize: t.height || 12

                }));

            // UI tree
            textItems.forEach(item=>{

                const li = document.createElement("li");
                li.innerText = item.text;

                li.onclick = ()=>{
                    parent.postMessage({
                        pluginMessage:{ type:"highlight", id:item.id }
                    },"*");
                };

                tree.appendChild(li);
            });

            // 🔥 STREAM PAGE
            parent.postMessage({
                pluginMessage:{
                    type:"page-chunk",
                    page:{
                        textItems,
                        width:viewport.width,
                        height:viewport.height,
                        index:i
                    }
                }
            },"*");

            // tránh block UI
            await new Promise(r=>setTimeout(r,10));
        }

        parent.postMessage({
            pluginMessage:{ type:"done-stream" }
        },"*");
    }

    /* ===== RECEIVE ===== */

    onmessage = (e)=>{
        const msg = e.data.pluginMessage;

        if(msg.type === "select-sync"){
            document.getElementById("code").value = msg.code;
        }
    };
</script>

</body>
</html>
